<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoChat - Debug Image</title>
    <style>
        :root { --p: #007AFF; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100dvh; }
        header { padding: 15px; background: white; border-bottom: 1px solid #ddd; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 15px; }
        .moi { align-self: flex-end; background: var(--p); color: white; }
        .ami { align-self: flex-start; background: #e9e9eb; color: black; }
        .img-msg { width: 100%; max-width: 250px; border-radius: 12px; display: block; background: #eee; min-height: 50px; }
        .bar { padding: 10px; background: white; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        .btn { background: var(--p); color: white; border: none; border-radius: 20px; padding: 10px 15px; cursor: pointer; }
        #setup { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="setup">
    <h1 id="my-id" style="font-size: 50px; color: var(--p);">----</h1>
    <input type="text" id="peer-id" placeholder="Code ami" style="padding:10px; margin-bottom:10px;">
    <button onclick="connecter()" class="btn">REJOINDRE</button>
</div>

<header>Test Image Direct</header>
<div id="chat"></div>

<div class="bar" id="controls" style="visibility:hidden">
    <input type="file" id="file" hidden onchange="sendPhoto(this)" accept="image/*">
    <button class="btn" onclick="document.getElementById('file').click()">📷 PHOTO</button>
    <input type="text" id="msg-in" style="flex:1; border-radius:20px; border:1px solid #ddd; padding:5px 15px;">
    <button class="btn" onclick="sendText()">↑</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const myId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(myId);
    let conn;
    let tempImg = "";

    peer.on('open', id => document.getElementById('my-id').innerText = id);
    peer.on('connection', c => { conn = c; setup(); });

    function connecter() {
        conn = peer.connect(document.getElementById('peer-id').value);
        setup();
    }

    function setup() {
        document.getElementById('setup').style.display = 'none';
        document.getElementById('controls').style.visibility = 'visible';
        conn.on('data', data => {
            if (data.type === 'img') {
                tempImg += data.data;
                if (data.done) { addImg(tempImg, 'ami'); tempImg = ""; }
            } else { addMsg(data, 'ami'); }
        });
    }

    function sendPhoto(input) {
        const file = input.files[0];
        if (!file) return;

        // Étape 1 : On prévient que ça charge
        addMsg("⏳ Envoi de l'image...", 'moi');

        const reader = new FileReader();
        reader.onerror = () => alert("Erreur lors de la lecture du fichier");
        reader.onload = (e) => {
            const base64 = e.target.result;
            
            // Étape 2 : Affichage local immédiat
            addImg(base64, 'moi');

            // Étape 3 : Envoi par morceaux (chunks)
            const size = 15000; 
            for (let i = 0; i < base64.length; i += size) {
                conn.send({
                    type: 'img',
                    data: base64.substring(i, i + size),
                    done: (i + size >= base64.length)
                });
            }
        };
        reader.readAsDataURL(file);
    }

    function addMsg(txt, type) {
        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="bubble ${type}">${txt}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }

    function addImg(src, type) {
        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="bubble ${type}"><img src="${src}" class="img-msg"></div>`;
        chat.scrollTop = chat.scrollHeight;
    }

    function sendText() {
        const i = document.getElementById('msg-in');
        if(i.value && conn) { conn.send(i.value); addMsg(i.value, 'moi'); i.value = ""; }
    }
</script>
</body>
</html>
