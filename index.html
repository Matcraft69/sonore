<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoChat Fix</title>
    <style>
        :root { --p: #007AFF; --bg: #f2f2f7; --card: rgba(255, 255, 255, 0.85); --text: #1c1c1e; }
        .dark-mode { --bg: #000; --card: rgba(30, 30, 30, 0.85); --text: #fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; transition: 0.4s; }
        .app { flex: 1; display: flex; flex-direction: column; max-width: 500px; margin: auto; width: 100%; background: var(--card); backdrop-filter: blur(20px); }
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(128,128,128,0.2); }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 15px; word-wrap: break-word; }
        .moi { align-self: flex-end; background: var(--p); color: white; }
        .ami { align-self: flex-start; background: rgba(128,128,128,0.2); }
        .img-msg { width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; }
        .vocal-btn-play { background: #34c759; color: white; border: none; border-radius: 20px; padding: 5px 15px; cursor: pointer; font-weight: bold; }
        .bar { padding: 10px; display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(128,128,128,0.2); }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: none; background: rgba(128,128,128,0.1); color: var(--text); }
        .btn-circle { width: 40px; height: 40px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .rec { background: #ff3b30 !important; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="app">
    <header>
        <b>NeoChat Pro</b>
        <button onclick="document.body.classList.toggle('dark-mode')" style="background:none; border:none; font-size:20px;">🌓</button>
    </header>

    <div id="chat">
        <div id="setup" style="text-align:center; margin-top:50px;">
            <h1 id="my-id" style="font-size:40px; color:var(--p);">----</h1>
            <input type="text" id="peer-id" placeholder="Code ami" style="width:60%; padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid #ccc;"><br>
            <button onclick="connecter()" style="background:var(--p); color:white; padding:10px 20px; border-radius:10px; border:none;">REJOINDRE</button>
        </div>
    </div>

    <div class="bar" id="controls" style="display:none">
        <button class="btn-circle" onclick="document.getElementById('file').click()">🖼️</button>
        <input type="text" id="msg-in" placeholder="Message...">
        <button id="vocal-btn" class="btn-circle" style="background:#5856d6; color:white;">🎤</button>
        <button class="btn-circle" onclick="send()" style="background:var(--p); color:white;">↑</button>
        <input type="file" id="file" hidden onchange="sendImg(this)" accept="image/*">
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const myId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(myId);
    let conn, mediaRecorder, chunks = [];

    peer.on('open', id => document.getElementById('my-id').innerText = id);
    peer.on('connection', c => { conn = c; init(); });

    function connecter() {
        conn = peer.connect(document.getElementById('peer-id').value);
        init();
    }

    function init() {
        document.getElementById('setup').style.display = 'none';
        document.getElementById('controls').style.display = 'flex';
        conn.on('data', d => {
            if(d.type === 'vocal') addVocal(d.content, 'ami');
            else if(d.type === 'image') addImg(d.content, 'ami');
            else addMsg(d, 'ami');
        });
    }

    function addMsg(c, t) {
        const h = document.getElementById('chat');
        h.innerHTML += `<div class="bubble ${t}">${c}</div>`;
        h.scrollTop = h.scrollHeight;
