<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Wi-Fi Pro</title>
    <style>
        :root { --bg: #f0f2f5; --card: white; --text: #333; --border: #ccc; }
        .dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f0f0f0; --border: #444; }
        
        body { font-family: sans-serif; text-align: center; padding: 20px; background: var(--bg); color: var(--text); transition: 0.3s; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        #chat { height: 300px; border: 1px solid var(--border); overflow-y: auto; margin: 15px 0; padding: 10px; text-align: left; background: var(--bg); border-radius: 8px; }
        input[type="text"] { width: 65%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); }
        button { padding: 12px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .id-display { font-size: 32px; font-weight: bold; color: #28a745; background: #e8f5e9; padding: 10px; border-radius: 8px; margin: 10px 0; }
        .img-chat { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .download-btn { background: #28a745; font-size: 12px; padding: 5px 10px; margin-top: 5px; width: auto; }
        .msg-container { margin-bottom: 15px; padding: 5px; border-bottom: 1px solid var(--border); }
        .header-btns { display: flex; justify-content: space-between; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-btns">
        <h2>Messagerie</h2>
        <button onclick="toggleDarkMode()" style="background:#555; width:auto;">🌙/☀️</button>
    </div>
    
    <div id="setup">
        <p>Ton code :</p>
        <div id="my-id" class="id-display">....</div>
        <input type="text" id="friend-name" placeholder="Nom de l'ami">
        <input type="text" id="peer-id" inputmode="numeric" placeholder="Code de l'ami">
        <button onclick="connecter()" style="width:100%">SE CONNECTER</button>
    </div>

    <div id="chat-box" style="display:none;">
        <h3 id="chat-with">Chat</h3>
        <div id="chat"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="message" placeholder="Message...">
            <button onclick="document.getElementById('file-input').click()">📷</button>
            <button onclick="envoyer()">OK</button>
        </div>
        <input type="file" id="file-input" style="display:none" accept="image/*" onchange="envoyerImage(this)">
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const monId = Math.floor(1000 + Math.random() * 9000).toString();
    const peer = new Peer(monId); 
    let conn;
    let nomAmi = "Ami";

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    peer.on('open', id => document.getElementById('my-id').innerText = id);
    peer.on('connection', c => {
        conn = c;
        nomAmi = prompt("Nom de l'ami ?", "Ami") || "Ami";
        activerInterfaceChat();
    });

    function connecter() {
        const idAmi = document.getElementById('peer-id').value;
        nomAmi = document.getElementById('friend-name').value || "Ami";
        if (!idAmi) return alert("Code manquant");
        conn = peer.connect(idAmi);
        activerInterfaceChat();
    }

    function activerInterfaceChat() {
        document.getElementById('setup').style.display = 'none';
        document.getElementById('chat-box').style.display = 'block';
        document.getElementById('chat-with').innerText = "Avec " + nomAmi;
        conn.on('data', data => {
            if (data.type === 'image') { afficherImage(data.content, 'ami'); } 
            else { afficherMessage(data, 'ami'); }
        });
    }

    function envoyer() {
        const input = document.getElementById('message');
        if (input.value && conn) {
            conn.send(input.value);
            afficherMessage(input.value, 'moi');
            input.value = "";
        }
    }

    function envoyerImage(input) {
        const file = input.files[0];
        if (!file || !conn) return;
        const reader = new FileReader();
        reader.onload = e => {
            const base64 = e.target.result;
            conn.send({ type: 'image', content: base64 });
            afficherImage(base64, 'moi');
        };
        reader.readAsDataURL(file);
    }

    function afficherMessage(msg, type) {
        const chat = document.getElementById('chat');
        const auteur = type === 'moi' ? 'Moi' : nomAmi;
        chat.innerHTML += `<div class="msg-container"><b>${auteur}:</b> ${msg}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }

    function afficherImage(src, type) {
        const chat = document.getElementById('chat');
        const auteur = type === 'moi' ? 'Moi' : nomAmi;
        const downloadBtn = `<br><button class="download-btn" onclick="telecharger('${src}')">⬇️ Enregistrer</button>`;
        chat.innerHTML += `<div class="msg-container"><b>${auteur}:</b><img src="${src}" class="img-chat">${downloadBtn}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }

    function telecharger(src) {
        const link = document.createElement('a');
        link.href = src;
        link.download = "image_recue.png";
        link.click();
    }
</script>
</body>
</html>
