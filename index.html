<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modem Acoustique Stable</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 15px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        #output { font-size: 32px; color: #28a745; font-weight: bold; min-height: 50px; background: #eee; border-radius: 8px; padding: 10px; margin: 10px 0; }
        #debug { font-family: monospace; color: #666; font-size: 14px; }
        button { padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; width: 100%; margin: 10px 0; color: white; font-weight: bold; }
        .btn-send { background: #28a745; }
        .btn-mic { background: #007bff; }
        input { width: 90%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        .bar-container { width: 100%; height: 10px; background: #ddd; border-radius: 5px; margin: 10px 0; }
        #volume-bar { width: 0%; height: 100%; background: #007bff; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Émetteur</h2>
        <input type="text" id="msg" placeholder="Message à envoyer...">
        <button class="btn-send" onclick="transmettre()">ENVOYER PAR LE SON</button>
    </div>

    <div class="card">
        <h2>Récepteur</h2>
        <button class="btn-mic" onclick="demarrer()">ACTIVER LE MICRO</button>
        <div class="bar-container"><div id="volume-bar"></div></div>
        <div id="debug">Attente du signal...</div>
        <div id="output"></div>
        <button onclick="document.getElementById('output').innerText=''" style="background:#888;">Effacer le texte</button>
    </div>

    <script>
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const f0 = 1200, f1 = 1600, duration = 0.3;

        function transmettre() {
            const text = document.getElementById('msg').value;
            // Signal de départ "1111" pour caler le récepteur
            const bits = "1111" + text.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join('');
            let time = ctx.currentTime;

            for (let bit of bits) {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.frequency.value = (bit === '1') ? f1 : f0;
                osc.connect(g); g.connect(ctx.destination);
                g.gain.setValueAtTime(0, time);
                g.gain.linearRampToValueAtTime(0.1, time + 0.02);
                g.gain.linearRampToValueAtTime(0, time + duration - 0.02);
                osc.start(time); osc.stop(time + duration);
                time += duration;
            }
        }

        let buffer = "", lastBit = null, lastTime = 0;

        async function demarrer() {
            if (ctx.state === 'suspended') await ctx.resume();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const src = ctx.createMediaStreamSource(stream);
            const ana = ctx.createAnalyser();
            ana.fftSize = 2048;
            src.connect(ana);

            const data = new Uint8Array(ana.frequencyBinCount);
            const hzPerBin = ctx.sampleRate / ana.fftSize;
            const i0 = Math.round(f0 / hzPerBin), i1 = Math.round(f1 / hzPerBin);

            function loop() {
                ana.getByteFrequencyData(data);
                
                // Visualiseur de volume
                const vol = Math.max(...data);
                document.getElementById('volume-bar').style.width = (vol / 2.5) + "%";

                let bit = null;
                if (data[i1] > 60 && data[i1] > data[i0]) bit = "1";
                else if (data[i0] > 60 && data[i0] > data[i1]) bit = "0";

                const now = Date.now();
                if (bit !== null && bit !== lastBit && (now - lastTime > 250)) {
                    buffer += bit;
                    lastBit = bit;
                    lastTime = now;
                    
                    if (buffer.includes("1111")) {
                        let content = buffer.split("1111")[1];
                        document.getElementById('debug').innerText = "Bits : " + content;

                        if (content && content.length === 8) {
                            document.getElementById('output').innerText += String.fromCharCode(parseInt(content, 2));
                            buffer = "1111"; // Prêt pour la lettre suivante
                        }
                    }
                } else if (bit === null) {
                    lastBit = null;
                }
                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
