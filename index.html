<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Récepteur Acoustique</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f4f8; }
        #output { font-size: 24px; font-weight: bold; margin-top: 20px; color: #007bff; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Décodeur de Sons</h1>
    <button onclick="startListening()">Activer le micro</button>
    <div id="output">En attente de signal...</div>

    <script>
        let buffer = "";
        let lastBit = null;

        async function startListening() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const ctx = new AudioContext();
            const source = ctx.createMediaStreamSource(stream);
            const analyzer = ctx.createAnalyser();
            analyzer.fftSize = 2048;
            source.connect(analyzer);

            const data = new Uint8Array(analyzer.frequencyBinCount);
            
            function loop() {
                analyzer.getByteFrequencyData(data);
                
                // On cherche la fréquence dominante entre 1200Hz et 1600Hz
                let idx1200 = Math.round(1200 / (ctx.sampleRate / analyzer.fftSize));
                let idx1600 = Math.round(1600 / (ctx.sampleRate / analyzer.fftSize));

                if (data[idx1600] > 100) decodeBit('1');
                else if (data[idx1200] > 100) decodeBit('0');
                else lastBit = null;

                requestAnimationFrame(loop);
            }
            loop();
        }

        function decodeBit(bit) {
            if (bit !== lastBit) {
                buffer += bit;
                lastBit = bit;
                if (buffer.length === 8) {
                    const char = String.fromCharCode(parseInt(buffer, 2));
                    document.getElementById('output').innerText += char;
                    buffer = "";
                }
            }
        }
    </script>
</body>
</html>
